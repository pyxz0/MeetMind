# MeetMind 生产部署编排
#
# 拓扑：
#   浏览器 -> nginx(frontend:80) -> backend:3000 -> postgres:5432
#
# 只有 frontend 对外暴露端口；backend 与 postgres 仅在内部网络可达，
# 避免数据库和接口被直接访问。

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 用变量而非硬编码用户名，避免改了账号后健康检查失真
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - meetmind

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 容器内用服务名连库，不走宿主机 localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      TZ: Asia/Shanghai
    volumes:
      # 录音必须落盘持久化，否则重建容器就丢音频
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - meetmind

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
      args:
        # 生产走同源反向代理
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      # 只暴露 80；如需改端口只改左边
      - "${HTTP_PORT:-80}:80"
    networks:
      - meetmind

volumes:
  pgdata:
  uploads:

networks:
  meetmind:
    driver: bridge
