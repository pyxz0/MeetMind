# MeetMind 前端站点配置
#
# 单容器同时承担两件事：
#   1. 托管 Vue 构建产物（SPA）
#   2. 反向代理后端接口与录音文件，使前端只需访问同源地址
# 这样浏览器端不涉及跨域，也不需要额外开放后端端口。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 录音上传上限需与后端 200MB 限制保持一致；
    # nginx 默认 1MB，不改会导致上传大录音直接 413。
    client_max_body_size 200m;

    # 上传大文件时放宽超时，避免慢网络下被提前断开
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 静态资源压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端接口
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 生成需要几十秒，别用默认 60s 卡掉
        proxy_read_timeout 180s;
    }

    # 录音文件：交给后端静态服务，保留 Range 以便拖动进度条
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # 显式透传 Range，保证音频可跳转播放
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;

        # 录音体积大，允许浏览器缓存一天
        expires 1d;
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/history/12 这类前端路由不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后能立刻拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
