# MeetMind 域名入口：meetmind.asia
#
# 80 端口只做两件事：放行 ACME 续期验证、其它一律 301 到 https。
# 443 承载真正的站点，路由与 80 共用 app-common.conf。
#
# 证书由 acme.sh 写入 /etc/nginx/certs（宿主机 ./frontend/certs 挂载进来）：
#   fullchain.pem  证书链
#   key.pem        私钥
# 首次部署前若证书不存在，nginx 会启动失败 —— 部署脚本会先生成自签占位证书。

server {
    listen 80;
    server_name meetmind.asia www.meetmind.asia;

    # Let's Encrypt HTTP-01 验证文件必须能在 80 上明文访问，不能被跳转吃掉
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name meetmind.asia www.meetmind.asia;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    # 安全响应头（含 HSTS）统一在 security-headers.conf 里声明，
    # 由 app-common.conf 及其内部自带 add_header 的 location 分别 include。
    include /etc/nginx/app-common.conf;
}
