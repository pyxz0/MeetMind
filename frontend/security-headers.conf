# 安全响应头（被多处 include）
#
# 为什么单独抽一个文件：nginx 的 add_header 不跨层级继承 ——
# 只要某个 location 自己声明了 add_header（比如 /index.html 的 Cache-Control、
# /assets 的 immutable），server 级的所有 add_header 都会整体失效。
# 所以凡是自带 add_header 的 location，都要把这个文件再 include 一次。

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# 一年内只走 https；纯 HTTP 响应里带这个头会被浏览器忽略，无副作用
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
