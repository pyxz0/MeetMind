# MeetMind 前端站点配置
#
# 单容器同时承担两件事：
#   1. 托管 Vue 构建产物（SPA）
#   2. 反向代理后端接口，使前端只需访问同源地址
# 后端不再对外提供静态目录，录音通过鉴权接口 /api/meetings/:id/audio 播放。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 录音上传上限需与后端限制一致；nginx 默认 1MB，不改会导致上传大录音直接 413。
    client_max_body_size 200m;

    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 后端接口（含录音流，走鉴权）
    #
    # 用前缀匹配同时覆盖 /api 与 /api/xxx：早先给 /api 单独写 301 到 /api/，
    # 在反向代理端口（如 8099）下 nginx 会按容器内 80 端口生成绝对地址，
    # 把端口丢掉，外部健康检查会 404/连不上。
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 生成需要几十秒，别用默认 60s 卡掉
        proxy_read_timeout 180s;

        # 语音识别与上传不需要缓冲，直接透传
        proxy_buffering off;
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退：/history/12 这类前端路由不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存，保证发版后能立刻拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}