# MeetMind 前端站点配置（默认入口：IP 直连 / 内网探活）
#
# 单容器同时承担两件事：
#   1. 托管 Vue 构建产物（SPA）
#   2. 反向代理后端接口，使前端只需访问同源地址
# 后端不再对外提供静态目录，录音通过鉴权接口 /api/meetings/:id/audio 播放。
#
# 域名 + HTTPS 的入口在 https.conf（同一个 conf.d 目录，自动加载）。
# 两者共用 app-common.conf 里的路由，改路由只改一处。

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/app-common.conf;
}
