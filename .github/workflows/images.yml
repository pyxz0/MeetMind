name: Build images

# 为什么要有这个 workflow：
#
# 生产是 2 核 2G 的小机器，在上面跑前后端全量构建会把整台机压到用户态
# 进程无法调度（2026-11-22 出过一次，线上不可用十几分钟）。
# 所以镜像在 GitHub 的机器上构建，推到**阿里云 ACR**，服务器只做 pull + up。
#
# 为什么不用 GHCR：ghcr.io 的 manifest 能拿到，但镜像层在国内被阻断 ——
# 服务器 `docker pull` 会卡在零进度（实测 150 秒没有任何下载）。
# ACR 与 ECS 同在华南3（广州），还能走 VPC 内网拉取。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   ACR_USERNAME  ACR 用户名（阿里云账号全名或 RAM 用户）
#   ACR_PASSWORD  ACR 固定密码（控制台「访问凭证」里设置，不是阿里云登录密码）
#
# 如果 ACR 不在广州，改下面 env 里的 REGISTRY / NAMESPACE 即可。
#
# 这里不重复跑 lint/单测 —— ci.yml 已经做了。构建本身会执行
# `tsc` 与 `vue-tsc`，等于再兜一层类型检查。

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yaml'
      - '.github/workflows/images.yml'
  # 允许在 Actions 页面手动触发（例如只想重建镜像而不改代码）
  workflow_dispatch:

# 连续 push 时取消上一次未完成的构建，避免旧提交的镜像把 latest 覆盖回去
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  # ACR 有两个域名格式，以控制台「访问凭证」页面显示的为准：
  #   老版个人版：registry.cn-guangzhou.aliyuncs.com
  #   新版个人版：crpi-xxxxxxxx.cn-guangzhou.personal.cr.aliyuncs.com
  # 用仓库 Variables 覆盖（Settings → Secrets and variables → Actions → Variables）：
  #   ACR_REGISTRY / ACR_NAMESPACE
  REGISTRY: ${{ vars.ACR_REGISTRY || 'registry.cn-guangzhou.aliyuncs.com' }}
  NAMESPACE: ${{ vars.ACR_NAMESPACE || 'meetmind' }}
  IMAGE_PREFIX: ${{ vars.ACR_REGISTRY || 'registry.cn-guangzhou.aliyuncs.com' }}/${{ vars.ACR_NAMESPACE || 'meetmind' }}/meetmind

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            target: runtime
            args: |
              NODE_IMAGE=node:24-alpine
          - name: frontend
            context: ./frontend
            target: runtime
            args: |
              NODE_IMAGE=node:24-alpine
              NGINX_IMAGE=nginx:1.27-alpine
              VITE_API_BASE_URL=/api
          # 迁移单独出镜像：它复用 backend 的 deps 阶段（带 prisma CLI），
          # runtime 镜像里没有 CLI，不能拿 backend 跑 migrate
          - name: migrate
            context: ./backend
            target: deps
            args: |
              NODE_IMAGE=node:24-alpine

    steps:
      - uses: actions/checkout@v5

      - name: 检查 ACR 凭据
        run: |
          if [ -z "${{ secrets.ACR_USERNAME }}" ] || [ -z "${{ secrets.ACR_PASSWORD }}" ]; then
            echo "::error::缺少 ACR_USERNAME / ACR_PASSWORD，请在仓库 Settings → Secrets and variables → Actions 里配置"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          # latest 给生产用，sha 用于回滚到任意一次提交
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          build-args: ${{ matrix.args }}
          # 三个镜像共用 backend 上下文，scope 分开才不会互相污染缓存
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
