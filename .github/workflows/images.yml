name: Build images

# 为什么要有这个 workflow：
#
# 生产是 2 核 2G 的小机器，在上面跑前后端全量构建会把整台机压到用户态
# 进程无法调度（2026-11-22 出过一次，线上不可用十几分钟）。
# 所以镜像改在 GitHub 的机器上构建并推到 GHCR，服务器只做 pull + up。
#
# 这里不重复跑 lint/单测 —— ci.yml 已经做了。构建本身会执行
# `tsc` 与 `vue-tsc`，等于再兜一层类型检查。

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'compose.yaml'
      - '.github/workflows/images.yml'
  # 允许在 Actions 页面手动触发（例如只想重建镜像而不改代码）
  workflow_dispatch:

# 连续 push 时取消上一次未完成的构建，避免旧提交的镜像把 latest 覆盖回去
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # 用 repository_owner 而不是写死 pyxz0：fork 后也能直接跑
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/meetmind

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # 用内置 GITHUB_TOKEN 推包，不需要额外配 PAT
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            target: runtime
            args: |
              NODE_IMAGE=node:24-alpine
          - name: frontend
            context: ./frontend
            target: runtime
            args: |
              NODE_IMAGE=node:24-alpine
              NGINX_IMAGE=nginx:1.27-alpine
              VITE_API_BASE_URL=/api
          # 迁移单独出镜像：它复用 backend 的 deps 阶段（带 prisma CLI），
          # runtime 镜像里没有 CLI，不能拿 backend 跑 migrate
          - name: migrate
            context: ./backend
            target: deps
            args: |
              NODE_IMAGE=node:24-alpine

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          # latest 给生产用，sha 用于回滚到任意一次提交
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}
          build-args: ${{ matrix.args }}
          # 三个镜像共用 backend 上下文，scope 分开才不会互相污染缓存
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
